# Netlify configuration for the Comerça web app.
#
# This project also ships an Express server (server.ts) for traditional
# Node hosting (Render, Railway, a VPS, etc. via `npm run build && npm start`).
# On Netlify, that Express server never runs — Netlify only serves static
# files — so the same three API routes are re-implemented as serverless
# functions in netlify/functions/, and the redirects below map
# /api/* calls made by the frontend to those functions.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/gemini/chat"
  to = "/.netlify/functions/gemini-chat"
  status = 200

[[redirects]]
  from = "/api/auth/send-code"
  to = "/.netlify/functions/send-code"
  status = 200

[[redirects]]
  from = "/api/auth/verify-code"
  to = "/.netlify/functions/verify-code"
  status = 200

# Single-page app fallback: any other route is handled client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
